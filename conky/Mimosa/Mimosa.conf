conky.config = {
--==============================================================================

--  Created : 2022/Jul/30
--  This theme is for conky version 1.10.8 or newer
-- 
--  MIMOSA DARK
--  ( A part of Leonis Conky themes pack )
--
--  author  : Closebox73
--  version : 4.0
--  variant : Verdant Celcius
--  license : Distributed under the terms of GPLv3

--==============================================================================

-- Size and Position settings --
  alignment = 'top_right',
  gap_x = 30,
  gap_y = 50,
  maximum_width = 330,
  minimum_height = 800,
  minimum_width = 300,
  
-- Text settings --
  use_xft = true,
  override_utf8_locale = true,
  font = 'Roboto:light:size=9',
  
-- Color Settings --
  default_color = 'ffffff',
  default_outline_color = 'white',
  default_shade_color = 'white',
  color1 = '#FF4539',
  color2 = '#32d74c',
  
-- Window Settings --
  background = false,
  border_width = 1,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '#00000000',
  own_window_class = 'Conky',
  draw_blended = false,
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_type = 'normal',
  own_window_transparent = false,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  stippled_borders = 0,
  
-- Others --
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  out_to_console = false,
  out_to_stderr = false,
  extra_newline = false,
  update_interval = 1,
  uppercase = false,
  use_spacer = 'none',
  show_graph_scale = false,
  show_graph_range = false,
  lua_load = '~/.config/conky/Mimosa/lib/disk_bar.lua ~/.config/conky/Mimosa/lib/rings_rounded.lua',
  lua_draw_hook_pre = '',
  lua_draw_hook_post = 'system_rings',
}

conky.text = [[
${execi 600 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -g}\
${image ~/.config/conky/Mimosa/assets/bg_weather.png -s 300x148 -p 0,135}\
${image ~/.config/conky/Mimosa/assets/bg_rings.png -s 300x122 -p 0,293}\
${image ~/.config/conky/Mimosa/assets/bg_cpu.png -s 300x222 -p 0,425}\
${image ~/.config/conky/Mimosa/assets/bg_storage.png -s 300x136 -p 0,657}\
${offset 10}${voffset 30}${font Inter:light:size=50}${time %H:%M}${font}
${offset 10}${voffset 15}${font Abel:size=14}${time %A %d %B}
${offset 14}${voffset 15}${font feather:size=25}${execi 15 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -i}${goto 73}${font Bebas Neue:size=22}${execi 100 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -t}°C${font}
${offset 14}${voffset 4}${color1}${font Abel:bold:size=14}${execi 100 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -n}${font}
${offset 14}${voffset 0}${color}${font Abel:size=12}${execi 100 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -d}${font}
${offset 14}${voffset 0}${color}${font Abel:size=8}Wind speed : ${execi 100 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -ws}m/s
${offset 14}${voffset 0}${color}${font Abel:size=8}Humidity : ${execi 100 ~/.config/conky/Mimosa/scripts/weather-v4.0.sh -h}%
${offset 172}${voffset -115}${font Hack Nerd Font:size=9}${goto 176}${execi 5 ~/.config/conky/Mimosa/scripts/ssid}${font}
${offset 172}${voffset 2}${font Abel:size=8}Dn : ${downspeed wlp17s0}${alignr 16}>>   ${totaldown wlp17s0}
${offset 172}${voffset 0}${color}${downspeedgraph wlp17s0 24,110 FF8C5A FF4539}
${offset 172}${voffset -3}${color}${font Abel:size=8}Up : ${upspeed wlp17s0}${alignr 16}>>   ${totalup wlp17s0}
${offset 172}${voffset 0}${color B54036}${upspeedgraph wlp17s0 24,110 00FF9F 32d74c}
${voffset 98}${color}${font Bebas Neue:size=17}${goto 35}${execi 3 free -b | awk '/Mem:/{printf "%.1fG", $3/1073741824}'}${goto 106}${execi 2 awk '{printf "%.1fG", $1/1073741824}' /sys/class/drm/card1/device/mem_info_vram_used}${goto 180}${execi 2 cat /sys/class/drm/card1/device/gpu_busy_percent}%${goto 244}${hwmon 2 temp 1}°C
${offset 18}${voffset 32}${font Hack Nerd Font:size=10}${color2}  ${font Abel:bold:size=11}${color}RYZEN 9 9900X3D${alignr 18}${font Bebas Neue:size=13}${color2}${hwmon 4 temp 1}°C  ${color}${freq_g}GHz${font}
${offset 14}${voffset 204}${color}${font Abel:bold:size=14}Storage${font}
]]
