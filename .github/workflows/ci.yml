name: CI - PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  lint-and-unit:
    name: Syntax, ShellCheck & Unit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax (bash -n)
        run: |
          bash -n setup.sh
          for f in lib/*.sh; do
            bash -n "$f"
          done
          bash -n ags/start.sh
          for f in ags/scripts/*.sh; do
            bash -n "$f"
          done
          bash -n conky/Mimosa/start.sh

      - name: Run ShellCheck (errors)
        run: |
          shellcheck -S error setup.sh lib/*.sh ags/start.sh ags/scripts/*.sh conky/Mimosa/start.sh

      - name: Validate JSON files & script permissions
        run: |
          jq empty ags/package.json
          jq empty ags/tsconfig.json
          test -x setup.sh
          test -x ags/start.sh
          test -x conky/Mimosa/start.sh

      - name: Unit tests for GRUB resolution helper
        run: |
          LOG_FILE="/tmp/ci-unit.log"
          source lib/core.sh
          source lib/grub.sh
          [[ "$(build_grub_gfxmode "3440x1440")" == "3440x1440,2560x1080,1920x1080,auto" ]]
          [[ "$(build_grub_gfxmode "2560x1440")" == "2560x1440,1920x1080,1280x720,auto" ]]
          [[ "$(build_grub_gfxmode "1920x1200")" == "1920x1200,1680x1050,1440x900,1920x1080,auto" ]]
          [[ "$(build_grub_gfxmode "")" == "auto" ]]

  dry-run-ubuntu:
    name: Dry-Run (Ubuntu / Debian)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup.sh --help & --dry-run variants
        run: |
          ./setup.sh --help
          ./setup.sh --dry-run
          ./setup.sh --conky --dry-run
          ./setup.sh --steps deps,wayland,grub,ags,zsh,plasma,session --dry-run

  dry-run-multi-distro:
    name: Dry-Run (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            expected_pkg: pacman
          - name: Fedora
            image: fedora:latest
            expected_pkg: dnf
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            expected_pkg: zypper
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup.sh --dry-run in ${{ matrix.name }}
        run: |
          output="$(SUDO_USER=root ./setup.sh --dry-run)"
          echo "$output"
          echo "$output" | grep -q "pkg: ${{ matrix.expected_pkg }}"
          SUDO_USER=root ./setup.sh --conky --dry-run
